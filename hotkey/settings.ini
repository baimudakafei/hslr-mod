# ============================================================
#  待机快捷键 Mod · 配置文件
# ============================================================
# 改完保存，然后重新跑一次「安装」（双击 manage.cmd 选 3）即可生效。
# 所有路径留空 = 自动检测。手动填写请用完整路径，正反斜杠都可以。
# 「#」开头是注释行，可以随便删改，不影响功能。
#
# ── 键位速查 ──
#   待机键在下面 [hotkeys] 段改（详细用例见那一节的注释）。
# ============================================================

[paths]
# ── 游戏根目录 ──
# HSLR.exe 所在的文件夹。自动检测（Steam 清单/全盘常见位置）失败时手动填。
# 例：game = D:\SteamLibrary\steamapps\common\幻世錄 Remake
game =

# ── 游戏 Mod 目录 ──
# 游戏存 Mod 条目的 MODS 文件夹（游戏内 Mod 列表读的就是这里的 mod.json）。
# 留空 = 自动定位 %USERPROFILE%\AppData\LocalLow\UserJoy\HSLR\MODS。
# 一般不用填；游戏装在特殊位置导致自动定位失败时才手动指路。
# 例：mods = C:\Users\我的用户名\AppData\LocalLow\UserJoy\HSLR\MODS
mods =

# ── Steam 库根目录 ──
# 游戏装在非标准 Steam 库、自动发现全部失败时，手动指一次路（steamapps 的上一层）。
# 例：steam = D:\SteamLibrary
steam =

[mod]
# 游戏 Mod 列表里的条目 ID，DLL 靠它认开关。没有特殊需求不要改。
id = 待机快捷键

[hotkeys]
# ── 待机（默认：空格）──
# 改键示例：把待机从空格换成 F 键 →
#   1) 删掉或注释掉「space = wait」这一行
#   2) 加一行「f = wait」
# 改完保存后重跑一次安装；游戏目录里的 hslr-wait-hotkey.ini 也会被同步更新。
#
# 键名写法（小写）：
#   字母键  ：直接写字母，如 f / j / k
#   数字键  ：主键盘 1~0 写 digit1 … digit0；小键盘写 numpad0 … numpad9
#   功能键  ：f1 … f12
#   其它常用：space(空格) enter(回车) tab escape(esc)
#             up down left right(方向键) leftshift rightshift leftctrl …
#
# 三类用例（把行首的 # 去掉并注释掉 space = wait 即可启用）：
#   f = wait            ← 字母键：F 键待机
#   digit0 = wait       ← 数字键：主键盘 0 待机
#   numpad0 = wait      ← 小键盘：0 待机
#   f8 = wait           ← 功能键：F8 待机
#
# 进阶：一个动作可以绑多个键（写多行），也可以给别的动作绑键，
#       动作名：move 移动 / attack 攻击 / skill 特殊技 / magic 魔法 /
#               item 道具 / status 状态 / wait 待机
#       例：# f = attack   （F 键 → 攻击）
space = wait
